# PTF NN Agent Configuration for t1-small topology
# This file configures the PTF (Packet Test Framework) network namespaces and interfaces

# Interface mapping for PTF container
# Format: interface_name = container_interface
# Note: eth0 is reserved for management network in containerlab

# PTF interfaces connected to sonic-dut
eth1 = eth1  # Connected to sonic-dut:eth3 (PTF test port 0)
eth2 = eth2  # Connected to sonic-dut:eth4 (PTF test port 1)

# PTF test parameters
ptf_test_port_map = {
    0: "eth1@0",
    1: "eth2@1"
}

# DUT information
dut_hostname = "sonic-dut"
dut_mgmt_ip = "172.30.30.2"  # Adjust based on actual mgmt IP assigned by containerlab

# Test configuration
test_params = {
    "testbed_type": "t1-small",
    "router_mac": "00:11:22:33:44:55",
    "sonic_asic_type": "vs"
}

