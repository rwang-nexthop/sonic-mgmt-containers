name: sonic-vs-t0
mgmt:
    network: mgmt-net
    ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    sonic-vs:
      image: docker-sonic-vs:latest
  nodes:
    # DUT - Device Under Test (SONiC-VS)
    dut:
      kind: sonic-vs
      mgmt-ipv4: 172.20.20.2
      env:
        SONIC_BOOT_TYPE: warm
      ports:
        - "8022:22"
        - "8161:161"
      exec:
        - bash -c 'ip link set dev eth0 mtu 9100'

    # Leaf Neighbors (SONiC-VS)
    leaf1:
      kind: sonic-vs
      mgmt-ipv4: 172.20.20.11
      env:
        SONIC_BOOT_TYPE: warm
      exec:
        - bash -c 'ip link set dev eth0 mtu 9100'

    leaf2:
      kind: sonic-vs
      mgmt-ipv4: 172.20.20.12
      env:
        SONIC_BOOT_TYPE: warm
      exec:
        - bash -c 'ip link set dev eth0 mtu 9100'

    leaf3:
      kind: sonic-vs
      mgmt-ipv4: 172.20.20.13
      env:
        SONIC_BOOT_TYPE: warm
      exec:
        - bash -c 'ip link set dev eth0 mtu 9100'

    leaf4:
      kind: sonic-vs
      mgmt-ipv4: 172.20.20.14
      env:
        SONIC_BOOT_TYPE: warm
      exec:
        - bash -c 'ip link set dev eth0 mtu 9100'

  links:
    # DUT to Leaf connections (T0 topology)
    - endpoints: ["dut:Ethernet0", "leaf1:Ethernet0"]
    - endpoints: ["dut:Ethernet4", "leaf2:Ethernet0"]
    - endpoints: ["dut:Ethernet8", "leaf3:Ethernet0"]
    - endpoints: ["dut:Ethernet12", "leaf4:Ethernet0"]

    # Inter-leaf connections for redundancy
    - endpoints: ["leaf1:Ethernet4", "leaf2:Ethernet4"]
    - endpoints: ["leaf3:Ethernet4", "leaf4:Ethernet4"]

