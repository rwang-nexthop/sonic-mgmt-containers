# Topology Name: t1-small-vm
# Description: A virtual lab for SONiC testing featuring VM-based SONiC nodes,
#              a PTF tester, and a dedicated management container.
#              This is the VM version of t1-small topology.
# 
# Key Differences from sonic-vs:
# - Uses sonic-vm kind (VM-based) instead of sonic-vs (container-based)
# - Requires KVM/virtualization support on the host
# - Takes ~1 minute to boot (vs ~10 seconds for sonic-vs)
# - More realistic SONiC behavior and performance
# - Default credentials: admin:admin
#
name: t1-small-vm

mgmt:
  network: t1-mgmt
  ipv4-subnet: 172.30.30.0/24

topology:
  kinds:
    sonic-vm:
      # Replace with your sonic-vm image
      # Examples:
      # - container-registry.sw.internal.nexthop.ai/clab-sonic:12336
      # - ghcr.io/sonic-net/sonic-vs:latest (if available)
      image: container-registry.sw.internal.nexthop.ai/clab-sonic:12336
    linux:
      image: ghcr.io/srl-labs/alpine:latest

  nodes:
    # 1. Main SONiC DUT (Device Under Test) - VM-based
    sonic-dut:
      kind: sonic-vm
      startup-config: ../configs/sonic-dut/config_db.json
      mgmt-ipv4: 172.30.30.5
      ports:
        - "8081:80"    # HTTP access
        - "8444:443"   # HTTPS access

    # 2. T0 Neighbor (Tier 0 - VM-based SONiC)
    t0:
      kind: sonic-vm
      startup-config: ../configs/t0/config_db.json
      mgmt-ipv4: 172.30.30.6

    # 3. T2 Neighbor (Tier 2 - VM-based SONiC)
    t2:
      kind: sonic-vm
      startup-config: ../configs/t2/config_db.json
      mgmt-ipv4: 172.30.30.3

    # 4. PTF (Packet Test Framework) Container
    ptf:
      kind: linux
      image: container-registry.sw.internal.nexthop.ai:443/docker-ptf
      mgmt-ipv4: 172.30.30.2
      binds:
        - ../configs/ptf:/ptf:rw
      env:
        PTF_ENV_NAME: t1-small-vm
      ports:
        - "8009:8009"  # PTF RPC port

    # 5. SONiC Management Container
    sonic-mgmt:
      kind: linux
      image: sonicdev-microsoft.azurecr.io:443/docker-sonic-mgmt:latest
      mgmt-ipv4: 172.30.30.4
      binds:
        - /var/run/docker.sock:/var/run/docker.sock
        - ../configs:/configs:ro
        - ~/sonic-mgmt:/sonic-mgmt:rw
      env:
        SONIC_MGMT_LAB: t1-small-vm

  links:
    # --- DATA LINKS ---
    # Connect T0 and T2 neighbors to sonic-dut data ports
    - endpoints: ["t0:eth1", "sonic-dut:eth1"]
    - endpoints: ["t2:eth1", "sonic-dut:eth2"]

    # --- PTF INJECT LINKS ---
    # Connect PTF to sonic-dut for traffic injection/reception
    # Note: PTF uses eth1/eth2 (eth0 is reserved for management)
    - endpoints: ["ptf:eth1", "sonic-dut:eth3"]
    - endpoints: ["ptf:eth2", "sonic-dut:eth4"]

    # --- NEIGHBOR INTERCONNECT ---
    # Optional: Connect T0 and T2 for more complex routing scenarios
    - endpoints: ["t0:eth2", "t2:eth2"]

